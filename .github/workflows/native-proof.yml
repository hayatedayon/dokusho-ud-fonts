name: Native shaping proofs

# 手動実行 (workflow_dispatch) は、ビルドしたフォントを固定した OS の版で確かめる (結果を残す。advisory)。
# 週 1 回の定期実行 (schedule) は、公開中の最新のリリースのフォントを、最新の OS の版 (macos-latest・windows-latest)
# で確かめ、合否の検査が外れたら実行を失敗にする (GitHub がメールで知らせる)。schedule は main でだけ動く。
on:
  workflow_dispatch:
    inputs:
      fonts:
        description: 'Fonts to check: build (fonts built from this ref) or release (a published release)'
        type: choice
        options: [build, release]
        default: build
      release_tag:
        description: 'With fonts=release: the release tag (empty = the latest release)'
        type: string
        default: ''
  schedule:
    # 毎週日曜 19:17 UTC (月曜 04:17 JST)。毎時 0 分・30 分の混雑を避ける
    - cron: '17 19 * * 0'

permissions:
  contents: read

# Independent workflow: build.yml / release.yml / pages.yml do not depend on it.
# advisory (continue-on-error) は schedule 以外。schedule では検査が外れるとジョブも実行も失敗になる。
jobs:
  native-proof:
    name: ${{ matrix.engine }} (${{ github.event_name == 'schedule' && 'scheduled, latest release' || 'advisory' }})
    continue-on-error: ${{ github.event_name != 'schedule' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            latest: macos-latest
            engine: coretext
          - os: windows-2025
            latest: windows-latest
            engine: directwrite
    runs-on: ${{ github.event_name == 'schedule' && matrix.latest || matrix.os }}
    env:
      FONT_SOURCE: ${{ github.event_name == 'schedule' && 'release' || inputs.fonts || 'build' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -m venv .venv
          else
            python3 -m venv .venv
          fi
          if [ -f .venv/Scripts/python.exe ]; then
            proof_python=.venv/Scripts/python.exe
          else
            proof_python=.venv/bin/python
          fi
          "$proof_python" -m pip install -r requirements.txt
          echo "PROOF_PYTHON=$proof_python" >> "$GITHUB_ENV"
      - name: Build all four fonts
        if: env.FONT_SOURCE == 'build'
        shell: bash
        run: |
          "$PROOF_PYTHON" scripts/fetch_sources.py
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          "$PROOF_PYTHON" scripts/build.py
          echo "FONT_DIR=fonts" >> "$GITHUB_ENV"
          echo "FONT_LABEL=built from $GITHUB_SHA ($GITHUB_REF_NAME)" >> "$GITHUB_ENV"
      - name: Fetch the published release fonts
        if: env.FONT_SOURCE == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-fonts
          gh release download ${RELEASE_TAG:+"$RELEASE_TAG"} --repo "$GITHUB_REPOSITORY" --pattern '*.ttf' --dir release-fonts --clobber
          tag="${RELEASE_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "FONT_DIR=release-fonts" >> "$GITHUB_ENV"
          echo "FONT_LABEL=release $tag" >> "$GITHUB_ENV"
      - name: CoreText (Swift / CoreGraphics)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/native
          { sw_vers; echo "runner image: $ImageOS $ImageVersion"; echo "fonts: $FONT_LABEL"; } | tee dist/native/platform.txt
          swiftc scripts/native/coretext.swift -o dist/native/coretext-renderer
          "$PROOF_PYTHON" scripts/native_proof.py --fonts "$FONT_DIR" --renderer dist/native/coretext-renderer
      - name: DirectWrite (Windows SDK / Direct2D / WIC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/native | Out-Null
          (Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsBuildNumber | Out-String), "runner image: $env:ImageOS $env:ImageVersion", "fonts: $env:FONT_LABEL" | Tee-Object dist/native/platform.txt
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC tools not found' }
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          cmd /c "`"$devcmd`" -arch=x64 && cl /nologo /std:c++17 /EHsc /W4 /utf-8 scripts/native/directwrite.cpp /Fe:dist/native/directwrite.exe /Fo:dist/native/directwrite.obj /link dwrite.lib d2d1.lib windowscodecs.lib ole32.lib"
          if ($LASTEXITCODE -ne 0) { throw 'DirectWrite compiler failed' }
          & $env:PROOF_PYTHON scripts/native_proof.py --fonts $env:FONT_DIR --renderer dist/native/directwrite.exe
          if ($LASTEXITCODE -ne 0) { throw 'DirectWrite proofs failed' }
      # Small hinted pixels (9-20 px). directwrite.cpp draws 24 px without pixel snapping, so the TrueType hinting never shows;
      # hintpix.cpp uses CreateGlyphRunAnalysis + CreateAlphaTexture. Only for built fonts: the published release (the latest)
      # and the built fonts are rendered the same way and kept in the artifact (dist/native/hintpix/{release,build}), with a summary.
      - name: DirectWrite small-size hinted pixels (published release and built fonts)
        if: runner.os == 'Windows' && env.FONT_SOURCE == 'build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC tools not found' }
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          cmd /c "`"$devcmd`" -arch=x64 && cl /nologo /std:c++17 /EHsc /W4 /utf-8 scripts/native/hintpix.cpp /Fe:dist/native/hintpix.exe /Fo:dist/native/hintpix.obj /link dwrite.lib ole32.lib"
          if ($LASTEXITCODE -ne 0) { throw 'hintpix compiler failed' }
          New-Item -ItemType Directory -Force hintpix-release | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*.ttf' --dir hintpix-release --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release download failed' }
          $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          "release: $tag", "build: $env:FONT_LABEL" | Tee-Object dist/native/hintpix-fonts.txt
          foreach ($set in @(@{ name = 'release'; dir = 'hintpix-release' }, @{ name = 'build'; dir = $env:FONT_DIR })) {
            New-Item -ItemType Directory -Force "dist/native/hintpix/$($set.name)" | Out-Null
            foreach ($font in Get-ChildItem "$($set.dir)/*.ttf") {
              & dist/native/hintpix.exe $font.FullName "dist/native/hintpix/$($set.name)/$($font.BaseName).json"
              if ($LASTEXITCODE -ne 0) { throw "hintpix failed on $($font.Name)" }
            }
          }
          & $env:PROOF_PYTHON scripts/native/hintpix_compare.py dist/native/hintpix/release dist/native/hintpix/build dist/native/hintpix/summary.json
          if ($LASTEXITCODE -ne 0) { throw 'hintpix comparison failed' }
      - name: Preserve fonts, glyph IDs, advances and images (including partial failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DokushoUD-${{ matrix.engine }}
          path: |
            dist/native/
            fonts/*.ttf
            release-fonts/*.ttf
            OFL.txt
          if-no-files-found: error
          retention-days: 7

  # Safari (macOS。WebKit + CoreText) と Microsoft Edge (Windows。WebView2 と同じ Chromium + HarfBuzz) を、ランナーに入っている
  # safaridriver・msedgedriver から W3C WebDriver で動かし、確認用のページを測る (scripts/browser_proof.py。標準ライブラリだけ)。
  # 今は advisory (結果の保存だけ。schedule でも失敗にしない)。2 回以上同じ値が出た項目だけを、あとで合否にする
  browser-proof:
    name: ${{ matrix.browser }} (advisory)
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            latest: macos-latest
            browser: safari
          - os: windows-2025
            latest: windows-latest
            browser: edge
    runs-on: ${{ github.event_name == 'schedule' && matrix.latest || matrix.os }}
    env:
      FONT_SOURCE: ${{ github.event_name == 'schedule' && 'release' || inputs.fonts || 'build' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -m venv .venv
            proof_python=.venv/Scripts/python.exe
          else
            python3 -m venv .venv
            proof_python=.venv/bin/python
          fi
          "$proof_python" -m pip install -r requirements.txt
          echo "PROOF_PYTHON=$proof_python" >> "$GITHUB_ENV"
      - name: Fonts (built or the published release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$FONT_SOURCE" = build ]; then
            "$PROOF_PYTHON" scripts/fetch_sources.py
            SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
            export SOURCE_DATE_EPOCH
            "$PROOF_PYTHON" scripts/build.py
            echo "FONT_DIR=fonts" >> "$GITHUB_ENV"
            echo "FONT_LABEL=built from $GITHUB_SHA ($GITHUB_REF_NAME)" >> "$GITHUB_ENV"
          else
            mkdir -p release-fonts
            gh release download ${RELEASE_TAG:+"$RELEASE_TAG"} --repo "$GITHUB_REPOSITORY" --pattern '*.ttf' --dir release-fonts --clobber
            tag="${RELEASE_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
            echo "FONT_DIR=release-fonts" >> "$GITHUB_ENV"
            echo "FONT_LABEL=release $tag" >> "$GITHUB_ENV"
          fi
      - name: Enable safaridriver
        if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - name: Measure in the browser
        shell: bash
        env:
          PROOF_BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p dist/browser
          { echo "runner image: $ImageOS $ImageVersion"; echo "fonts: $FONT_LABEL"; } | tee dist/browser/platform.txt
          "$PROOF_PYTHON" scripts/browser_proof.py --browser "$PROOF_BROWSER" --fonts "$FONT_DIR" --output dist/browser
      - name: Preserve results and screenshots (including partial failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DokushoUD-${{ matrix.browser }}
          path: |
            dist/browser/*.json
            dist/browser/*.png
            dist/browser/*.txt
            dist/browser/*.log
          if-no-files-found: error
          retention-days: 7
