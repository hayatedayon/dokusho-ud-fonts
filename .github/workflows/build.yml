name: Build

on:
  push:
    branches:
      - main
  pull_request:
  # 手動で実行するときだけ、成果物の保存日数を指定できる。公開前のフォントを数日かけて試す
  # 候補版には 14 などを指定する (既定は 1 日。リポジトリの上限は 90 日)
  workflow_dispatch:
    inputs:
      retention_days:
        description: 成果物 (DokushoUD・DokushoUD-proof) を残す日数
        type: number
        default: 1
  # release.yml は、リリースの前にこのワークフローで作って確かめ、できたフォントを受け取る
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ランナーの Python は外からパッケージを入れられない (PEP 668) ので、venv に入れる
      - name: Install fontTools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # check.py は、FreeType で字を描き、HarfBuzz で組んで、元のフォントと比べる (ctypes で呼ぶ)。
      # 組んで比べるのには、Unicode の文字のデータ (見えない文字・縦書きの向き) も使う
      - name: Install FreeType, HarfBuzz and the Unicode data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype6 libharfbuzz0b unicode-data

      - name: Fetch the original fonts
        run: .venv/bin/python scripts/fetch_sources.py

      # 作った日時をコミットの日時にする (同じコミットからは同じファイル)
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          .venv/bin/python scripts/build.py

      - name: Check
        run: |
          dpkg-query -W libfreetype6 libharfbuzz0b unicode-data
          .venv/bin/python scripts/check.py

      # 配るのはフォントだけ。著作権表示と使用許諾の全文は、フォントの中 (name の 0 と 13) にある。
      # 残すのは 1 日だけ。プルリクエストで作ったフォントを手元で確かめるには足り、release.yml は
      # 同じ実行の中ですぐに受け取る (配るのはリリースで、成果物ではない)。手動実行だけは
      # retention_days で延ばせる。それ以外 (push・pull_request・workflow_call) の inputs は
      # 空なので || で 1 日になる
      - name: Upload the fonts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DokushoUD
          path: |
            fonts/*.ttf
            fonts/*.woff2
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 1 }}

      # 校正用の補助ページの失敗で、検証・保存済みフォントのリリースを止めない。
      - name: Generate reading proofs
        id: proofs
        continue-on-error: true
        timeout-minutes: 3
        run: |
          .venv/bin/python scripts/specimen_page.py
          .venv/bin/python scripts/overflow_page.py
          .venv/bin/python scripts/proof_page.py
          .venv/bin/python scripts/additions_proof.py

      # 数十秒かかるので、上の補助ページとは別のステップにする (失敗や時間切れで、ほかの見本の保存を止めない)。
      - name: Generate ruby trial proof
        continue-on-error: true
        timeout-minutes: 3
        run: .venv/bin/python scripts/ruby_proof.py

      # 展開後、ルートで http.server を起動して dist/proof.html を開く。
      # 比較に使う元フォントも含むため、OFL の全文を同梱する。
      - name: Upload reading proofs
        if: ${{ steps.proofs.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DokushoUD-proof
          path: |
            dist/*.html
            dist/additions/*.png
            fonts/*.ttf
            sources/*.ttf
            OFL.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 1 }}
