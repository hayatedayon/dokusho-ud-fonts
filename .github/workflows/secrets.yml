name: Secrets

on:
  push:
  pull_request:
  schedule:
    - cron: '41 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified betterleaks
        run: >-
          python3 scripts/install_supply_chain_tools.py betterleaks
          --bin-dir "$RUNNER_TEMP/bin" --download-dir "$RUNNER_TEMP/tool-downloads"
      - name: Scan working tree and commits
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          python3 scripts/scan_secrets.py
